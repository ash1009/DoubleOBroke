<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Double O Broke</title>
<meta name="description" content="A personal AI agent for Android that looks after money, email, tasks, travel fares, screen time and passwords.">
<style>
  :root { --bg: #fbfaf7; --text: #1d1d1b; --muted: #5e5c57; --line: #e4e1da; --accent: #b4561e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --text: #ecebe7; --muted: #a8a59e; --line: #2e2d2a; --accent: #f0a46c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 700px; margin: 0 auto; padding: 64px 16px 72px; }
  h1 { font-size: 2.4rem; line-height: 1.1; margin: 0 0 12px; }
  p { margin: 0 0 14px; }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
  .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
  .links a { text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; }
</style>
</head>
<body>
<main>
  <h1>Double O Broke</h1>
  <p>A personal AI agent for Android that looks after money, email, tasks, travel fares, screen time and passwords.</p>
  <p class="muted">It runs on the phone, with no server and no account.</p>
  <div class="links">
    <a href="https://github.com/ash1009/DoubleOBroke">Source code on GitHub</a>
    <a href="privacy.html">Privacy policy</a>
  </div>
</main>
</body>
</html>
